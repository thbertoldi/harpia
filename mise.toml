[tools]
go = "1.25"
python = "3.12"
node = "24"
bun = "latest"
opencode = "1.17.18"
"npm:@fission-ai/openspec" = "1.5.0"
uv = "latest"
buf = "latest"
tilt = "latest"
golangci-lint = "2.12.2"
atlas = "latest"
temporal = "latest"
helm = "latest"

[env]
HARPIA_ENV = "development"

[tasks.build]
description = "Build all services locally"
run = [
    "cd control-plane && go build ./cmd/api/",
    "cd agent-runtime && uv build",
    "cd frontend && bun run build",
]

[tasks.build-container-api]
description = "Build control-plane container image"
run = "podman build -t harpia-api:latest -f control-plane/Containerfile control-plane/"

[tasks.build-container-agent]
description = "Build agent-runtime container image"
run = "podman build -t harpia-agent:latest -f agent-runtime/Containerfile ."

[tasks.build-container-web]
description = "Build frontend container image"
run = "podman build -t harpia-frontend:latest -f frontend/Containerfile frontend/"

[tasks.build-containers]
description = "Build all container images"
run = [
    "mise run build-container-api",
    "mise run build-container-agent",
    "mise run build-container-web",
]

[tasks.test]
description = "Run all tests"
run = [
    "cd control-plane && go test ./...",
    "cd agent-runtime && uv run pytest",
    "cd frontend && bun test",
]

[tasks."test:e2e"]
description = "Run frontend Playwright E2E tests"
run = "cd frontend && bun run test:e2e"

[tasks.lint]
description = "Lint all code"
run = [
    "cd control-plane && golangci-lint run",
    "cd agent-runtime && uv run ruff check .",
    "cd frontend && bun run lint",
    "helm lint deploy/harpia/",
    "helm template test deploy/harpia/ > /dev/null",
]

[tasks.fmt]
description = "Format all code"
run = [
    "cd control-plane && go fmt ./...",
    "cd agent-runtime && uv run ruff format .",
    "cd frontend && bun run format",
]

[tasks.buf-generate]
description = "Generate protobuf code for all languages"
run = "cd proto && buf generate"

[tasks.buf-lint]
description = "Lint protobuf schemas"
run = "cd proto && buf lint"

[tasks.buf-breaking]
description = "Check for breaking changes in protobuf schemas"
run = "cd proto && buf breaking --against '.git#branch=trunk'"

[tasks.apply-zitadel-branding]
description = "Apply Harpia branding to a running Zitadel dev instance"
run = "./scripts/apply-zitadel-branding.sh"

[tasks.dev]
description = "Start dev environment (Tilt: compose infra + image builds)"
run = "tilt up"

[tasks.dev-infra]
description = "Start infrastructure only (podman compose)"
run = "podman compose -f deploy/dev/compose.yaml up -d"

[tasks.dev-infra-kind]
description = "Deploy infrastructure to kind cluster"
run = [
    "./scripts/ensure-dev-kind-secrets.sh",
    "kubectl apply -f deploy/dev/kind/",
]

[tasks.dev-down]
description = "Tear down dev environment"
run = "podman compose -f deploy/dev/compose.yaml down; tilt down 2>/dev/null; true"

[tasks.dev-frontend]
description = "Run frontend with Vite HMR (no infra needed)"
run = "cd frontend && bun run dev --host"

[tasks.dev-api]
description = "Run API server directly (hot reload outside k3s)"
run = "cd control-plane && go run ./cmd/api/"

[tasks.dev-agent]
description = "Run agent runtime directly (outside k3s)"
run = "cd agent-runtime && uv run python -m harpia_agents.main"

[tasks.dev-web]
description = "Run frontend directly with Vite HMR"
run = "cd frontend && bun run dev --host"

[tasks.dev-worker]
description = "Run Temporal worker directly (outside k3s)"
run = "cd control-plane && HARPIA_ROLE=worker go run ./cmd/api/"

[tasks.dev-agent-worker]
description = "Run agent Temporal worker directly (outside k3s)"
run = "cd agent-runtime && HARPIA_ROLE=worker uv run python -m harpia_agents.main"

[tasks.dev-openfga-migrate]
description = "Run OpenFGA database migrations"
run = "podman compose -f deploy/dev/compose.yaml run --rm openfga migrate --datastore-engine postgres --datastore-uri \"postgres://${HARPIA_DEV_POSTGRES_USERNAME:-harpia}:${HARPIA_DEV_POSTGRES_PASSWORD:-dev-postgres-password}@postgres:5432/openfga?sslmode=disable\""

[tasks.dev-temporal]
description = "Start Temporal dev server (single binary)"
run = "temporal server start-dev --namespace default --ip 0.0.0.0"

[tasks.helm-lint]
description = "Lint Helm chart"
run = "helm lint deploy/harpia/"

[tasks.helm-template]
description = "Validate Helm chart renders cleanly"
run = "helm template test deploy/harpia/ > /dev/null"

[tasks.db-migrate]
description = "Run database migrations"
run = "cd database && atlas migrate apply --dir migrations --url \"$DATABASE_URL\""

[tasks.dispatch]
description = "Run the coding-agent dispatcher"
run = "go run ./cmd/dispatch \"$@\""

[tasks.opencode-validate]
description = "Validate the project OpenCode roster and OpenSpec tooling policy"
run = "bun run scripts/ci/validate_opencode.ts \"$@\""
