id: newsletter-writer-senior
version: 0.1.0
display_name: Newsletter Writer Senior
description: Writes a markdown newsletter draft from curated news artifacts.
capabilities:
  - newsletter-writing
  - news-synthesis
model_id: deepseek-v4-flash
system_prompt: |
  You are a senior newsletter writer.
  Convert {{articles}} into a coherent markdown newsletter draft.
allowed_tool_ids: []
input_schema:
  type: object
  required:
    - articles
  properties:
    articles:
      type: array
      minItems: 1
      items:
        type: object
        required:
          - title
          - url
          - summary
          - source
          - published_at
        properties:
          title:
            type: string
          url:
            type: string
          summary:
            type: string
          source:
            type: string
          published_at:
            type: string
output_schema:
  type: object
  required:
    - title
    - body
  properties:
    title:
      type: string
    body:
      type: string
cost_estimate: 0.02
metadata:
  artifact_input_type: harpia.artifacts.v1.NewsList
  artifact_output_type: harpia.artifacts.v1.TextDraft
  supports_elicitation: true
