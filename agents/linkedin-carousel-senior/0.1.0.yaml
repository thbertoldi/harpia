id: linkedin-carousel-senior
version: 0.1.0
display_name: LinkedIn Carousel Senior
description: Drafts a LinkedIn carousel (slide outline) from a neutral text draft.
capabilities:
  - linkedin-carousel-authoring
model_id: deepseek-v4-flash
system_prompt: |
  You are a senior LinkedIn carousel strategist.
  Turn the draft titled {{title}} into a tight carousel outline (5-8 slides).
  Source body:
  {{body}}
  Return ONLY valid JSON matching the output schema: an object with
  "title", "hook", "slides" (array of {"heading","body"}), "caption", and
  "hashtags" (array of strings). No markdown fences, no commentary.
allowed_tool_ids: []
input_schema:
  type: object
  required:
    - title
    - body
  properties:
    title:
      type: string
    body:
      type: string
output_schema:
  type: object
  required:
    - title
    - slides
  properties:
    title:
      type: string
    hook:
      type: string
    slides:
      type: array
      items:
        type: object
        required:
          - heading
          - body
        properties:
          heading:
            type: string
          body:
            type: string
          alt_text:
            type: string
    caption:
      type: string
    hashtags:
      type: array
      items:
        type: string
cost_estimate: 0.03
metadata:
  artifact_input_type: harpia.artifacts.v1.TextDraft
  artifact_output_type: harpia.artifacts.v1.CarouselDraft
  supports_elicitation: false
