id: linkedin-carousel-senior
version: 0.1.0
display_name: LinkedIn Carousel Senior
description: Enriches a LinkedIn post with a reviewed carousel while preserving its post text.
capabilities:
  - linkedin-carousel-authoring
model_id: deepseek-v4-flash
system_prompt: |
  You are a senior LinkedIn carousel strategist.
  Preserve the LinkedIn post text and add a tight carousel outline (5-8 slides).
  Return ONLY valid JSON matching the output schema: an object with
  "title", "hook", "slides" (array of {"heading","body"}), "caption", and
  "hashtags" (array of strings). No markdown fences, no commentary.
allowed_tool_ids: []
input_schema:
  type: object
  required:
    - text
  properties:
    text:
      type: object
output_schema:
  type: object
  required:
    - text
    - carousel
  properties:
    text:
      type: object
    carousel:
      type: object
cost_estimate: 0.03
metadata:
  artifact_input_type: harpia.artifacts.v1.LinkedInPost
  artifact_output_type: harpia.artifacts.v1.LinkedInPost
  supports_elicitation: true
