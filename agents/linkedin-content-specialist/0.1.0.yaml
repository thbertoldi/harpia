id: linkedin-content-specialist
version: 0.1.0
display_name: LinkedIn Content Specialist (Sênior)
description: Multi-capable LinkedIn content agent — creates a LinkedIn post and enriches the same post with a carousel.
tier: senior
capabilities:
  - linkedin-content-adaptation
  - carousel-authoring
model_id: deepseek-v4-flash
system_prompt: |
  You are a LinkedIn content specialist with multiple capabilities. The active
  capability's prompt takes precedence.
allowed_tool_ids: []
cost_estimate: 0.03
metadata: {}
capability_specs:
  - id: linkedin-content-adaptation
    artifact_input_type: harpia.artifacts.v1.TextDraft
    artifact_output_type: harpia.artifacts.v1.LinkedInPost
    system_prompt: |
      You are a senior LinkedIn content specialist. Adapt the input into a polished
      LinkedIn post while preserving factual meaning. Preserve the draft's requested
      output language; if the body contains a Target language line, that requested
      output language overrides the language of source article titles and summaries.
    input_schema:
      type: object
      required:
        - title
        - body
      properties:
        title:
          type: string
        body:
          type: string
    output_schema:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          maxLength: 3000
        hook:
          type: string
        hashtags:
          type: array
          items:
            type: string
  - id: carousel-authoring
    artifact_input_type: harpia.artifacts.v1.LinkedInPost
    artifact_output_type: harpia.artifacts.v1.LinkedInPost
    system_prompt: |
      You are a senior LinkedIn carousel strategist. Preserve the supplied LinkedIn
      post text and add a tight carousel outline of 5-8 slides. Return ONLY valid JSON (no
      markdown fences, no commentary) with this shape: an object containing
      "title", "hook", "slides" (an array of objects each with "heading" and
      "body"), "caption", and "hashtags" (an array of strings). Preserve the
      draft's requested output language; if the body contains a Target language
      line, that requested output language overrides the language of source
      article titles and summaries.
    input_schema:
      type: object
      required:
        - text
      properties:
        text:
          type: object
    output_schema:
      type: object
      required:
        - text
        - carousel
      properties:
        text:
          type: object
        carousel:
          type: object
