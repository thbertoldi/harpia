key: linkedin-content-studio
name: LinkedIn Content Studio
description: Turn selected news into one reviewed LinkedIn post, optionally enriched with a carousel and generated images before publishing.
vertical: creator-economy
version: 3
steps:
  - key: fetch-news
    title: Fetch News
    description: Collect curated articles for the configured date range.
    input_artifact_type: harpia.artifacts.v1.DateRange
    output_artifact_type: harpia.artifacts.v1.NewsList
    executor_requirement:
      executor_kind: 2
      connection_type: rss_feed
    default_executor_sku_key: rss-news-feed
  - key: write-draft
    title: Write Draft
    description: Synthesize a platform-neutral content draft.
    input_artifact_type: harpia.artifacts.v1.NewsList
    output_artifact_type: harpia.artifacts.v1.TextDraft
    executor_requirement:
      executor_kind: 1
    default_executor_sku_key: newsletter-writer-senior
  - key: author-content
    title: Author LinkedIn Content
    description: Transform the draft into a LinkedIn-ready post via the multi-capable LinkedIn Content Specialist.
    input_artifact_type: harpia.artifacts.v1.TextDraft
    output_artifact_type: harpia.artifacts.v1.LinkedInPost
    executor_requirement:
      executor_kind: 1
      required_capabilities:
        - linkedin-content-adaptation
    default_executor_sku_key: linkedin-content-specialist
    human_interaction_policy:
      elicitation_mode: ELICITATION_MODE_WHEN_REQUIRED
      review_mode: REVIEW_MODE_REQUIRED
  - key: draft-carousel
    title: Draft Carousel
    description: Add a reviewed carousel to the LinkedIn post. Opt-in via the include_carousel capability.
    input_artifact_type: harpia.artifacts.v1.LinkedInPost
    output_artifact_type: harpia.artifacts.v1.LinkedInPost
    executor_requirement:
      executor_kind: 1
      required_capabilities:
        - carousel-authoring
      optional_capabilities:
        - carousel-authoring
    default_executor_sku_key: linkedin-content-specialist
    human_interaction_policy:
      elicitation_mode: ELICITATION_MODE_WHEN_REQUIRED
      review_mode: REVIEW_MODE_REQUIRED
  - key: generate-image
    title: Generate Image
    description: Add generated images to the reviewed LinkedIn post. Opt-in via the include_images capability.
    input_artifact_type: harpia.artifacts.v1.LinkedInPost
    output_artifact_type: harpia.artifacts.v1.LinkedInPost
    executor_requirement:
      executor_kind: 2
      connection_type: image_provider
      optional_capabilities:
        - image-generation
    default_executor_sku_key: image-asset-generator
    human_interaction_policy:
      elicitation_mode: ELICITATION_MODE_WHEN_REQUIRED
      review_mode: REVIEW_MODE_REQUIRED
  - key: publish
    title: Publish
    description: Publish the approved final LinkedIn post.
    input_artifact_type: harpia.artifacts.v1.LinkedInPost
    output_artifact_type: harpia.artifacts.v1.PublishConfirmation
    executor_requirement:
      executor_kind: 2
      connection_type: oauth_linkedin
    default_executor_sku_key: linkedin-publish
edges:
  - from_step_key: fetch-news
    to_step_key: write-draft
  - from_step_key: write-draft
    to_step_key: author-content
  - from_step_key: author-content
    to_step_key: draft-carousel
  - from_step_key: draft-carousel
    to_step_key: generate-image
  - from_step_key: generate-image
    to_step_key: publish
input_parameters:
  - key: theme
    label: Theme
    description: Main subject for the content.
    type: TEMPLATE_INPUT_PARAMETER_TYPE_TEXT
    required: true
    defaultValueJson: '"sports"'
    runtimeMappings:
      - target: TEMPLATE_INPUT_RUNTIME_TARGET_SEED_ARTIFACT
        stepKey: write-draft
        inputName: harpia.internal.ContentPreferences
        jsonPath: $.topic
  - key: language
    label: Language
    description: Language for generated drafts.
    type: TEMPLATE_INPUT_PARAMETER_TYPE_LANGUAGE
    required: true
    defaultValueJson: '"pt-BR"'
    optionsJson: '[{"value":"pt-BR","label":"Portuguese"},{"value":"en-US","label":"English"},{"value":"es","label":"Spanish"}]'
    runtimeMappings:
      - target: TEMPLATE_INPUT_RUNTIME_TARGET_SEED_ARTIFACT
        stepKey: write-draft
        inputName: harpia.internal.ContentPreferences
        jsonPath: $.language
  - key: tone
    label: Tone
    description: Voice used by the writer.
    type: TEMPLATE_INPUT_PARAMETER_TYPE_SELECT
    required: true
    defaultValueJson: '"analytical, concise, and practical"'
    optionsJson: '[{"value":"analytical, concise, and practical","label":"Analytical"},{"value":"friendly and clear","label":"Friendly"},{"value":"executive and direct","label":"Executive"}]'
    runtimeMappings:
      - target: TEMPLATE_INPUT_RUNTIME_TARGET_SEED_ARTIFACT
        stepKey: write-draft
        inputName: harpia.internal.ContentPreferences
        jsonPath: $.tone
  - key: audience
    label: Audience
    description: Who the post should speak to.
    type: TEMPLATE_INPUT_PARAMETER_TYPE_TEXT
    required: false
    defaultValueJson: '""'
    runtimeMappings:
      - target: TEMPLATE_INPUT_RUNTIME_TARGET_SEED_ARTIFACT
        stepKey: write-draft
        inputName: harpia.internal.ContentPreferences
        jsonPath: $.audience
  - key: topics_to_avoid
    label: Topics to avoid
    description: Comma-separated topics the writer should avoid.
    type: TEMPLATE_INPUT_PARAMETER_TYPE_TEXTAREA
    required: false
    defaultValueJson: '""'
    runtimeMappings:
      - target: TEMPLATE_INPUT_RUNTIME_TARGET_SEED_ARTIFACT
        stepKey: write-draft
        inputName: harpia.internal.ContentPreferences
        jsonPath: $.topics_to_avoid
  - key: source_group
    label: Source group
    description: RSS feed group to use for source articles.
    type: TEMPLATE_INPUT_PARAMETER_TYPE_INTEGRATION_SELECTOR
    required: true
    defaultValueJson: '""'
    runtimeMappings:
      - target: TEMPLATE_INPUT_RUNTIME_TARGET_SLOT_BINDING
        stepKey: fetch-news
  - key: date_range
    label: Date range
    description: Article publication window.
    type: TEMPLATE_INPUT_PARAMETER_TYPE_DATE_RANGE
    required: true
    defaultValueJson: '{"preset":"schedule_window"}'
    runtimeMappings:
      - target: TEMPLATE_INPUT_RUNTIME_TARGET_SEED_ARTIFACT
        stepKey: fetch-news
        inputName: date_range
  - key: include_carousel
    label: Include carousel
    description: Also author a LinkedIn carousel alongside the post.
    type: TEMPLATE_INPUT_PARAMETER_TYPE_SELECT
    required: true
    defaultValueJson: '"no"'
    optionsJson: '[{"value":"yes","label":"Yes"},{"value":"no","label":"No"}]'
    runtimeMappings:
      - target: TEMPLATE_INPUT_RUNTIME_TARGET_INCLUDED_CAPABILITY
        policyKey: carousel-authoring
  - key: include_images
    label: Include images
    description: Generate a branded image asset for the post.
    type: TEMPLATE_INPUT_PARAMETER_TYPE_SELECT
    required: true
    defaultValueJson: '"no"'
    optionsJson: '[{"value":"yes","label":"Yes"},{"value":"no","label":"No"}]'
    runtimeMappings:
      - target: TEMPLATE_INPUT_RUNTIME_TARGET_INCLUDED_CAPABILITY
        policyKey: image-generation
  - key: approval_mode
    label: Approval mode
    description: Whether publishing requires approval.
    type: TEMPLATE_INPUT_PARAMETER_TYPE_SELECT
    required: true
    defaultValueJson: '"require_approval"'
    optionsJson: '[{"value":"require_approval","label":"Require approval"},{"value":"auto_publish","label":"Auto publish"}]'
    runtimeMappings:
      - target: TEMPLATE_INPUT_RUNTIME_TARGET_BEHAVIOR_POLICY
        policyKey: publish_approval_mode
  - key: elicitation_timeout_behavior
    label: Elicitation timeout behavior
    description: What happens when a human answer is needed and not provided in time.
    type: TEMPLATE_INPUT_PARAMETER_TYPE_SELECT
    required: true
    defaultValueJson: '"pause_until_answered"'
    optionsJson: '[{"value":"pause_until_answered","label":"Pause until answered"},{"value":"fail_step","label":"Fail step"},{"value":"fail_plan","label":"Fail plan"}]'
    runtimeMappings:
      - target: TEMPLATE_INPUT_RUNTIME_TARGET_BEHAVIOR_POLICY
        policyKey: elicitation_timeout_behavior
