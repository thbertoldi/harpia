syntax = "proto3";

package harpia.artifacts.v1;

// ArtifactService manages artifact type registration and artifact metadata.
// Payload bytes live in Garage; the control plane stores schema refs and content hashes.
service ArtifactService {
  rpc RegisterArtifactType(RegisterArtifactTypeRequest) returns (RegisterArtifactTypeResponse);
  rpc GetArtifactType(GetArtifactTypeRequest) returns (GetArtifactTypeResponse);
  rpc CreateArtifact(CreateArtifactRequest) returns (CreateArtifactResponse);
  rpc CreateArtifactWithPayload(CreateArtifactWithPayloadRequest) returns (CreateArtifactWithPayloadResponse);
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);
  rpc GetArtifactPayload(GetArtifactPayloadRequest) returns (GetArtifactPayloadResponse);
  rpc PreviewArtifact(PreviewArtifactRequest) returns (PreviewArtifactResponse);
}

message ArtifactType {
  string id = 1;
  string key = 2;
  string schema_ref = 3;
  int32 version = 4;
  string description = 5;
}

message Artifact {
  string id = 1;
  string artifact_type_id = 2;
  string tenant_id = 3;
  string storage_uri = 4;
  string content_hash = 5;
  string created_at = 6;
}

message DateRange {
  string start_date = 1;
  string end_date = 2;
}

message NewsArticle {
  string title = 1;
  string url = 2;
  string summary = 3;
  string source = 4;
  string published_at = 5;
}

message NewsList {
  repeated NewsArticle articles = 1;
}

message TextDraft {
  string title = 1;
  string body = 2;
}

message LinkedInPostDraft {
  string text = 1;
  string hook = 2;
  repeated string hashtags = 3;
}

message PublishConfirmation {
  string platform = 1;
  string external_id = 2;
  string url = 3;
  string published_at = 4;
}

message RegisterArtifactTypeRequest {
  string key = 1;
  string schema_ref = 2;
  int32 version = 3;
  string description = 4;
}

message RegisterArtifactTypeResponse {
  ArtifactType artifact_type = 1;
}

message GetArtifactTypeRequest {
  string artifact_type_id = 1;
  string key = 2;
}

message GetArtifactTypeResponse {
  ArtifactType artifact_type = 1;
}

message CreateArtifactRequest {
  string tenant_id = 1;
  string artifact_type_id = 2;
  string storage_uri = 3;
  string content_hash = 4;
}

message CreateArtifactResponse {
  Artifact artifact = 1;
}

message CreateArtifactWithPayloadRequest {
  string tenant_id = 1;
  string artifact_type_id = 2;
  string artifact_type_key = 3;
  bytes payload_json = 4;
  optional string step_execution_id = 5;
}

message CreateArtifactWithPayloadResponse {
  Artifact artifact = 1;
}

message GetArtifactRequest {
  string tenant_id = 1;
  string artifact_id = 2;
}

message GetArtifactResponse {
  Artifact artifact = 1;
}

message GetArtifactPayloadRequest {
  string tenant_id = 1;
  string artifact_id = 2;
}

message GetArtifactPayloadResponse {
  bytes payload_json = 1;
  string content_hash = 2;
}

message ArtifactListSummary {
  int32 article_count = 1;
  repeated string titles = 2;
}

message PreviewArtifactRequest {
  string tenant_id = 1;
  string artifact_id = 2;
}

message PreviewArtifactResponse {
  oneof preview {
    string text_preview = 1;
    ArtifactListSummary list_summary = 2;
    string json_preview = 3;
  }
}
