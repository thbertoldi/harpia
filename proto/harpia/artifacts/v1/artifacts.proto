syntax = "proto3";

package harpia.artifacts.v1;

// ArtifactService manages artifact type registration and artifact metadata.
// Payload bytes live in Garage; the control plane stores schema refs and content hashes.
service ArtifactService {
  rpc RegisterArtifactType(RegisterArtifactTypeRequest) returns (RegisterArtifactTypeResponse);
  rpc GetArtifactType(GetArtifactTypeRequest) returns (GetArtifactTypeResponse);
  rpc CreateArtifact(CreateArtifactRequest) returns (CreateArtifactResponse);
  rpc CreateArtifactWithPayload(CreateArtifactWithPayloadRequest) returns (CreateArtifactWithPayloadResponse);
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);
  rpc ListArtifacts(ListArtifactsRequest) returns (stream ListArtifactsResponse);
  rpc ListArtifactVersions(ListArtifactVersionsRequest) returns (ListArtifactVersionsResponse);
  rpc SaveTextArtifactVersion(SaveTextArtifactVersionRequest) returns (SaveTextArtifactVersionResponse);
  rpc GetArtifactPayload(GetArtifactPayloadRequest) returns (GetArtifactPayloadResponse);
  rpc PreviewArtifact(PreviewArtifactRequest) returns (PreviewArtifactResponse);
}

message ArtifactType {
  string id = 1;
  string key = 2;
  string schema_ref = 3;
  int32 version = 4;
  string description = 5;
}

message Artifact {
  string id = 1;
  string artifact_type_id = 2;
  string tenant_id = 3;
  string storage_uri = 4;
  string content_hash = 5;
  string created_at = 6;
  string updated_at = 7;
  string current_version_id = 8;
  string artifact_type_key = 9;
  string plan_configuration_id = 10;
  string plan_execution_id = 11;
  string step_execution_id = 12;
  string status = 13;
}

message ArtifactVersion {
  string id = 1;
  string artifact_id = 2;
  int32 version_number = 3;
  string storage_uri = 4;
  string content_hash = 5;
  string source_plan_execution_id = 6;
  string source_step_execution_id = 7;
  string source_version_id = 8;
  string created_by_user_id = 9;
  string created_by_kind = 10;
  string edit_summary = 11;
  string created_at = 12;
}

message DateRange {
  string start_date = 1;
  string end_date = 2;
}

message NewsArticle {
  string title = 1;
  string url = 2;
  string summary = 3;
  string source = 4;
  string published_at = 5;
}

message NewsList {
  repeated NewsArticle articles = 1;
}

message TextDraft {
  string title = 1;
  string body = 2;
}

message LinkedInPostDraft {
  string text = 1;
  string hook = 2;
  repeated string hashtags = 3;
}

message PublishConfirmation {
  string platform = 1;
  string external_id = 2;
  string url = 3;
  string published_at = 4;
}

message RegisterArtifactTypeRequest {
  string key = 1;
  string schema_ref = 2;
  int32 version = 3;
  string description = 4;
}

message RegisterArtifactTypeResponse {
  ArtifactType artifact_type = 1;
}

message GetArtifactTypeRequest {
  string artifact_type_id = 1;
  string key = 2;
}

message GetArtifactTypeResponse {
  ArtifactType artifact_type = 1;
}

message CreateArtifactRequest {
  string tenant_id = 1;
  string artifact_type_id = 2;
  string storage_uri = 3;
  string content_hash = 4;
}

message CreateArtifactResponse {
  Artifact artifact = 1;
}

message CreateArtifactWithPayloadRequest {
  string tenant_id = 1;
  string artifact_type_id = 2;
  string artifact_type_key = 3;
  bytes payload_json = 4;
  optional string step_execution_id = 5;
  optional string plan_configuration_id = 6;
  optional string plan_execution_id = 7;
}

message CreateArtifactWithPayloadResponse {
  Artifact artifact = 1;
}

message GetArtifactRequest {
  string tenant_id = 1;
  string artifact_id = 2;
}

message GetArtifactResponse {
  Artifact artifact = 1;
}

message ListArtifactsRequest {
  string tenant_id = 1;
  optional string plan_configuration_id = 2;
  optional string plan_execution_id = 3;
  optional string artifact_type_key = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListArtifactsResponse {
  repeated Artifact artifacts = 1;
  string next_page_token = 2;
}

message ListArtifactVersionsRequest {
  string tenant_id = 1;
  string artifact_id = 2;
}

message ListArtifactVersionsResponse {
  repeated ArtifactVersion versions = 1;
}

message SaveTextArtifactVersionRequest {
  string tenant_id = 1;
  string artifact_id = 2;
  string expected_content_hash = 3;
  string title = 4;
  string text = 5;
  string edit_summary = 6;
}

message SaveTextArtifactVersionResponse {
  Artifact artifact = 1;
  ArtifactVersion version = 2;
}

message GetArtifactPayloadRequest {
  string tenant_id = 1;
  string artifact_id = 2;
  optional string artifact_version_id = 3;
}

message GetArtifactPayloadResponse {
  bytes payload_json = 1;
  string content_hash = 2;
}

message ArtifactListSummary {
  int32 article_count = 1;
  repeated string titles = 2;
}

message PreviewArtifactRequest {
  string tenant_id = 1;
  string artifact_id = 2;
  optional string artifact_version_id = 3;
}

message PreviewArtifactResponse {
  oneof preview {
    string text_preview = 1;
    ArtifactListSummary list_summary = 2;
    string json_preview = 3;
  }
}
