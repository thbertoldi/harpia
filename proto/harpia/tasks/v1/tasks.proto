syntax = "proto3";

package harpia.tasks.v1;

import "buf/validate/validate.proto";

// TaskService manages the lifecycle of tasks and their decomposition into subtasks.
// This is the primary API through which the Svelte UI and Temporal workflows interact
// with the control plane.
service TaskService {
  // CreateTask creates a new task within a tenant.
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);

  // GetTask retrieves a task by its ID.
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);

  // ListTasks lists tasks for a tenant, optionally filtered by status or workspace.
  // Uses server-streaming for large result sets.
  rpc ListTasks(ListTasksRequest) returns (stream ListTasksResponse);

  // WatchTask streams task status changes to the UI in real time.
  rpc WatchTask(WatchTaskRequest) returns (stream WatchTaskResponse);
}

message Task {
  string id = 1;
  string tenant_id = 2;
  string workspace_id = 3;
  string title = 4;
  string description = 5;
  TaskStatus status = 6;
  repeated Subtask subtasks = 7;
  string created_at = 8;
  string updated_at = 9;
}

message Subtask {
  string id = 1;
  string task_id = 2;
  string description = 3;
  SubtaskStatus status = 4;
  string assigned_agent_id = 5;
  string created_at = 6;
  string updated_at = 7;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_PLANNING = 2;
  TASK_STATUS_IN_PROGRESS = 3;
  TASK_STATUS_AWAITING_FEEDBACK = 4;
  TASK_STATUS_COMPLETED = 5;
  TASK_STATUS_FAILED = 6;
  TASK_STATUS_CANCELLED = 7;
}

enum SubtaskStatus {
  SUBTASK_STATUS_UNSPECIFIED = 0;
  SUBTASK_STATUS_PENDING = 1;
  SUBTASK_STATUS_IN_PROGRESS = 2;
  SUBTASK_STATUS_AWAITING_FEEDBACK = 3;
  SUBTASK_STATUS_COMPLETED = 4;
  SUBTASK_STATUS_FAILED = 5;
}

message CreateTaskRequest {
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
  string title = 3 [(buf.validate.field).string.min_len = 1];
  string description = 4;
}

message CreateTaskResponse {
  Task task = 1;
}

message GetTaskRequest {
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  string task_id = 2 [(buf.validate.field).string.min_len = 1];
}

message GetTaskResponse {
  Task task = 1;
}

message ListTasksRequest {
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string workspace_id = 2;
  optional TaskStatus status = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  string next_page_token = 2;
}

message WatchTaskRequest {
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  string task_id = 2 [(buf.validate.field).string.min_len = 1];
}

message WatchTaskResponse {
  Task task = 1;
}


