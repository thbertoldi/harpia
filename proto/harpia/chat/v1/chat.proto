syntax = "proto3";

package harpia.chat.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/harpia/control-plane/gen/harpia/chat/v1;chatv1";

service ThreadService {
  rpc CreateThread(CreateThreadRequest) returns (CreateThreadResponse);
  rpc GetThread(GetThreadRequest) returns (GetThreadResponse);
  rpc ListThreads(ListThreadsRequest) returns (stream ListThreadsResponse);
  rpc ArchiveThread(ArchiveThreadRequest) returns (ArchiveThreadResponse);
  rpc ListThreadMessages(ListThreadMessagesRequest) returns (ListThreadMessagesResponse);
  rpc WatchThreadMessages(WatchThreadMessagesRequest) returns (stream WatchThreadMessagesResponse);
  rpc AppendThreadMessage(AppendThreadMessageRequest) returns (AppendThreadMessageResponse);
  rpc ProposePlan(ProposePlanRequest) returns (ProposePlanResponse);
}

message Thread {
  string id = 1;
  string tenant_id = 2;
  string title = 3;
  ThreadStatus status = 4;
  string active_plan_configuration_id = 5;
  string created_by_user_id = 6;
  google.protobuf.Timestamp archived_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

enum ThreadStatus {
  THREAD_STATUS_UNSPECIFIED = 0;
  THREAD_STATUS_OPEN = 1;
  THREAD_STATUS_RUNNING = 2;
  THREAD_STATUS_NEEDS_ATTENTION = 3;
  THREAD_STATUS_COMPLETED = 4;
  THREAD_STATUS_ARCHIVED = 5;
}

// ThreadMessage is a single durable record in a chat thread.
//
// thread_id is the owning Thread.id used by chat message list/watch APIs.
message ThreadMessage {
  string id = 1;                                // UUID
  string tenant_id = 2;                          // UUID
  string thread_id = 3;                          // UUID of the owning Thread
  string execution_id = 4;                       // optional; UUID of the PlanExecution this event belongs to
  ThreadMessageRole role = 5;
  ThreadMessageKind kind = 6;
  string text = 7;                               // user/assistant text or human-readable summary
  string payload_json = 8;                       // per-kind structured payload (see Kind-specific schemas)
  string author_user_id = 9;                     // optional; NULL for SYSTEM role
  int64 sequence_number = 10;                    // per-thread monotonic; used for WatchThreadMessages resume
  google.protobuf.Timestamp created_at = 11;
}

message CreateThreadRequest {
  string tenant_id = 1;
  string title = 2;
  string initial_message_text = 3;
}

message CreateThreadResponse {
  Thread thread = 1;
  ThreadMessage initial_message = 2;
}

message GetThreadRequest {
  string tenant_id = 1;
  string thread_id = 2;
}

message GetThreadResponse {
  Thread thread = 1;
}

message ListThreadsRequest {
  string tenant_id = 1;
  optional ThreadStatus status = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListThreadsResponse {
  repeated Thread threads = 1;
  string next_page_token = 2;
}

message ArchiveThreadRequest {
  string tenant_id = 1;
  string thread_id = 2;
}

message ArchiveThreadResponse {
  Thread thread = 1;
}

message ListThreadMessagesRequest {
  string tenant_id = 1;
  string thread_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListThreadMessagesResponse {
  repeated ThreadMessage messages = 1;
  string next_page_token = 2;
}

message WatchThreadMessagesRequest {
  string tenant_id = 1;
  string thread_id = 2;
  int64 since_sequence_number = 3;
}

message WatchThreadMessagesResponse {
  repeated ThreadMessage messages = 1;
}

message AppendThreadMessageRequest {
  string tenant_id = 1;
  string thread_id = 2;
  ThreadMessageRole role = 3;
  ThreadMessageKind kind = 4;
  string text = 5;
  string payload_json = 6;
  string execution_id = 7;
}

message AppendThreadMessageResponse {
  ThreadMessage message = 1;
}

message ProposePlanRequest {
  string tenant_id = 1;
  string thread_id = 2;
}

message ProposePlanResponse {
  // The appended PLAN_PROPOSED message (empty candidates when the router
  // could not confidently match a template).
  ThreadMessage message = 1;
}

enum ThreadMessageRole {
  THREAD_MESSAGE_ROLE_UNSPECIFIED = 0;
  THREAD_MESSAGE_ROLE_OVERSEER = 1;     // composer-typed messages from the user
  THREAD_MESSAGE_ROLE_AGENT = 2;         // reserved for M5 assistant; not emitted in M3
  THREAD_MESSAGE_ROLE_SYSTEM = 3;        // system events written by the platform (author_user_id is empty)
}

enum ThreadMessageKind {
  THREAD_MESSAGE_KIND_UNSPECIFIED = 0;
  THREAD_MESSAGE_KIND_USER_TEXT = 1;             // OVERSEER composer message
  THREAD_MESSAGE_KIND_ASSISTANT_TEXT = 2;        // reserved for M5
  THREAD_MESSAGE_KIND_CONFIGURATION_SAVED = 3;   // PlanConfiguration created or updated
  THREAD_MESSAGE_KIND_RUN_STARTED = 4;           // PlanExecution started
  THREAD_MESSAGE_KIND_RUN_COMPLETED = 5;         // PlanExecution finished successfully
  THREAD_MESSAGE_KIND_RUN_FAILED = 6;            // PlanExecution failed
  THREAD_MESSAGE_KIND_STEP_BOUND = 7;            // StepExecution completed (output artifact produced)
  THREAD_MESSAGE_KIND_ELICITATION_RAISED = 8;    // payload_json: { "elicitation_id": "..." }
  THREAD_MESSAGE_KIND_ELICITATION_ANSWERED = 9;  // payload_json: { "elicitation_id": "...", "outcome": "answered|timed_out|cancelled" }
  THREAD_MESSAGE_KIND_APPROVAL_RAISED = 10;      // payload_json: { "approval_request_id": "..." }
  THREAD_MESSAGE_KIND_APPROVAL_DECIDED = 11;     // payload_json: { "approval_request_id": "...", "approved": true|false }
  THREAD_MESSAGE_KIND_STEP_STARTED = 12;            // payload_json: { "step_key": "...", "step_execution_id": "..." }
  THREAD_MESSAGE_KIND_CONFIGURATION_STARTED = 13;   // payload_json: { "template_id": "..." }
  THREAD_MESSAGE_KIND_ASSISTANT_PROMPT      = 14;   // payload_json: { "state": "...", "step_key": "...", "options": [...] }
  THREAD_MESSAGE_KIND_USER_SELECTION        = 15;   // payload_json: { "in_response_to_message_id": "...", "option_id": "...", "value": "..." }
  THREAD_MESSAGE_KIND_STEP_REBOUND          = 16;   // payload_json: { "step_key": "...", "previous_executor_installation_id": "...", "new_executor_installation_id": "..." }
  THREAD_MESSAGE_KIND_SCHEDULE_SET          = 17;   // payload_json: { "schedule_cron": "...", "timezone": "..." }
  THREAD_MESSAGE_KIND_PLAN_PROPOSED = 18;
  THREAD_MESSAGE_KIND_PLAN_ATTACHED = 19;
  THREAD_MESSAGE_KIND_PLAN_UPDATED = 20;
  THREAD_MESSAGE_KIND_PLAN_RUN_REQUESTED = 21;
  THREAD_MESSAGE_KIND_ARTIFACT_CREATED = 22;
  THREAD_MESSAGE_KIND_ARTIFACT_UPDATED = 23;
  THREAD_MESSAGE_KIND_ERROR_RAISED = 24;
  THREAD_MESSAGE_KIND_ERROR_RECOVERED = 25;
  THREAD_MESSAGE_KIND_STEP_FAILED = 26;            // payload_json: { "step_key": "...", "step_execution_id": "...", "error": "..." }
}
