syntax = "proto3";

package harpia.plans.v1;

import "harpia/chat/v1/chat.proto";

// PlanService manages plan templates, tenant configurations, and executions.
// Template plans use the plan-centric model defined in ADR-012.
service PlanService {
  // Template catalog (global, read-only for tenants).
  rpc GetPlanTemplate(GetPlanTemplateRequest) returns (GetPlanTemplateResponse);
  rpc GetPlanTemplateByKey(GetPlanTemplateByKeyRequest) returns (GetPlanTemplateByKeyResponse);
  rpc ListPlanTemplates(ListPlanTemplatesRequest) returns (stream ListPlanTemplatesResponse);

  // Tenant plan configuration lifecycle.
  rpc CreatePlanConfiguration(CreatePlanConfigurationRequest) returns (CreatePlanConfigurationResponse);
  rpc GetPlanConfiguration(GetPlanConfigurationRequest) returns (GetPlanConfigurationResponse);
  rpc UpdatePlanConfiguration(UpdatePlanConfigurationRequest) returns (UpdatePlanConfigurationResponse);
  rpc ListPlanConfigurations(ListPlanConfigurationsRequest) returns (stream ListPlanConfigurationsResponse);
  // Conversational configuration assistant: derive and append the next
  // ASSISTANT_PROMPT for a configuration (binding/overseer/policies/matrix).
  rpc NextTurn(NextTurnRequest) returns (NextTurnResponse);
  // Submit a user's selection for the current ASSISTANT_PROMPT. The server
  // infers the mutation kind from the prompt's payload and applies it
  // atomically, then returns the updated configuration plus the messages
  // appended this turn (USER_SELECTION, optional STEP_REBOUND, next
  // ASSISTANT_PROMPT). Replaces the browser's 4-RPC configuration-selection
  // orchestration with a single server-authoritative call.
  rpc SubmitConfigurationSelection(SubmitConfigurationSelectionRequest)
      returns (SubmitConfigurationSelectionResponse);

  // Execution (MVP stubs — messages defined for downstream workflow wiring).
  rpc CreatePlanExecution(CreatePlanExecutionRequest) returns (CreatePlanExecutionResponse);
  rpc RetryPlanExecution(RetryPlanExecutionRequest) returns (RetryPlanExecutionResponse);
  rpc GetPlanExecution(GetPlanExecutionRequest) returns (GetPlanExecutionResponse);
  rpc ListPlanExecutions(ListPlanExecutionsRequest) returns (stream ListPlanExecutionsResponse);
  rpc GetStepExecution(GetStepExecutionRequest) returns (GetStepExecutionResponse);
  rpc ListStepExecutions(ListStepExecutionsRequest) returns (stream ListStepExecutionsResponse);

  // In-app elicitation thread (E5.1, FR-11, UX-DR5).
  // Overseers receive and answer agent questions scoped to a StepExecution.
  rpc ListElicitations(ListElicitationsRequest) returns (ListElicitationsResponse);
  rpc GetElicitation(GetElicitationRequest) returns (GetElicitationResponse);
  rpc RespondToElicitation(RespondToElicitationRequest) returns (RespondToElicitationResponse);
  rpc WatchElicitations(WatchElicitationsRequest) returns (stream WatchElicitationsResponse);

  // Publish approval gate (E5.2, FR-13, UX-DR6).
  // Overseers approve or reject LinkedInPostDraft artifacts before publish steps run.
  rpc ListApprovalRequests(ListApprovalRequestsRequest) returns (ListApprovalRequestsResponse);
  rpc GetApprovalRequest(GetApprovalRequestRequest) returns (GetApprovalRequestResponse);
  rpc RespondToApprovalRequest(RespondToApprovalRequestRequest) returns (RespondToApprovalRequestResponse);
  rpc WatchApprovalRequests(WatchApprovalRequestsRequest) returns (stream WatchApprovalRequestsResponse);
}

message PlanTemplate {
  string id = 1;
  string key = 2;
  string name = 3;
  string description = 4;
  string vertical = 5;
  int32 version = 6;
  repeated PlanStep steps = 7;
  repeated PlanStepDependency edges = 8;
  string created_at = 9;
  string updated_at = 10;
  repeated TemplateInputParameter input_parameters = 11;
}

enum TemplateInputParameterType {
  TEMPLATE_INPUT_PARAMETER_TYPE_UNSPECIFIED = 0;
  TEMPLATE_INPUT_PARAMETER_TYPE_TEXT = 1;
  TEMPLATE_INPUT_PARAMETER_TYPE_TEXTAREA = 2;
  TEMPLATE_INPUT_PARAMETER_TYPE_SELECT = 3;
  TEMPLATE_INPUT_PARAMETER_TYPE_LANGUAGE = 4;
  TEMPLATE_INPUT_PARAMETER_TYPE_DATE_RANGE = 5;
  TEMPLATE_INPUT_PARAMETER_TYPE_INTEGRATION_SELECTOR = 6;
}

enum TemplateInputRuntimeTarget {
  TEMPLATE_INPUT_RUNTIME_TARGET_UNSPECIFIED = 0;
  TEMPLATE_INPUT_RUNTIME_TARGET_SEED_ARTIFACT = 1;
  TEMPLATE_INPUT_RUNTIME_TARGET_SLOT_BINDING = 2;
  TEMPLATE_INPUT_RUNTIME_TARGET_BEHAVIOR_POLICY = 3;
  // Populates PlanConfiguration.included_optional_capabilities: a truthy value
  // for the mapped parameter opts the capability (policy_key) INTO the run.
  TEMPLATE_INPUT_RUNTIME_TARGET_INCLUDED_CAPABILITY = 4;
}

message TemplateInputRuntimeMapping {
  TemplateInputRuntimeTarget target = 1;
  string step_key = 2;
  string input_name = 3;
  string json_path = 4;
  string policy_key = 5;
}

message TemplateInputParameter {
  string key = 1;
  string label = 2;
  string description = 3;
  TemplateInputParameterType type = 4;
  bool required = 5;
  string default_value_json = 6;
  string options_json = 7;
  repeated TemplateInputRuntimeMapping runtime_mappings = 8;
}

message PlanStep {
  string id = 1;
  string key = 2;
  string title = 3;
  string description = 4;
  string input_artifact_type_id = 5;
  string output_artifact_type_id = 6;
  ExecutorRequirement executor_requirement = 7;
  string default_executor_sku_key = 8;
}

message PlanStepDependency {
  string from_step_key = 1;
  string to_step_key = 2;
}

message ExecutorRequirement {
  ExecutorKind executor_kind = 1;
  repeated string required_capabilities = 2;
  string connection_type = 3;
  // Capabilities that are opt-in for this step (ADR-018 D4). The step is skipped
  // (no binding, no executor) unless every one is in the run's
  // included_optional_capabilities.
  repeated string optional_capabilities = 4;
}

enum ExecutorKind {
  EXECUTOR_KIND_UNSPECIFIED = 0;
  EXECUTOR_KIND_AGENT = 1;
  EXECUTOR_KIND_INTEGRATION = 2;
}

message PlanConfiguration {
  string id = 1;
  string tenant_id = 2;
  string workspace_id = 3;
  string plan_template_id = 4;
  int32 plan_template_version = 5;
  PlanConfigurationStatus status = 6;
  repeated SeedArtifactBinding seed_artifacts = 7;
  repeated SlotBinding slot_bindings = 8;
  repeated OverseerBinding overseer_bindings = 9;
  PlanBehaviorPolicies behavior_policies = 10;
  PlanSchedule schedule = 11;
  string created_at = 12;
  string updated_at = 13;
  string parameter_values_json = 14;
  PlanConfigurationKind kind = 16;
  string origin_thread_id = 17;
  // Optional capabilities the user explicitly included for this run (ADR-018).
  // Steps whose required capability is optional but not listed here are excluded
  // from the run (skipped, no binding needed).
  repeated string included_optional_capabilities = 18;
}

enum PlanConfigurationKind {
  PLAN_CONFIGURATION_KIND_UNSPECIFIED = 0;
  PLAN_CONFIGURATION_KIND_ONE_SHOT = 1;
  PLAN_CONFIGURATION_KIND_RECURRING = 2;
}

enum PlanConfigurationStatus {
  PLAN_CONFIGURATION_STATUS_UNSPECIFIED = 0;
  PLAN_CONFIGURATION_STATUS_DRAFT = 1;
  PLAN_CONFIGURATION_STATUS_RUNNABLE = 2;
  PLAN_CONFIGURATION_STATUS_SCHEDULED = 3;
  PLAN_CONFIGURATION_STATUS_DISABLED = 4;
  PLAN_CONFIGURATION_STATUS_ARCHIVED = 5;
}

message SeedArtifactBinding {
  string step_key = 1;
  string input_name = 2;
  string artifact_id = 3;
  string literal_json = 4;
}

message SlotBinding {
  string step_key = 1;
  ExecutorKind executor_kind = 2;
  string executor_sku_id = 3;
  string executor_installation_id = 4;
}

message OverseerBinding {
  string step_key = 1;
  string overseer_user_id = 2;
}

message PlanBehaviorPolicies {
  ElicitationTimeoutBehavior elicitation_timeout_behavior = 1;
  int32 elicitation_timeout_hours = 2;
  PublishApprovalMode publish_approval_mode = 3;
  ContentOutputFormat content_output_format = 4;
}

enum ElicitationTimeoutBehavior {
  ELICITATION_TIMEOUT_BEHAVIOR_UNSPECIFIED = 0;
  ELICITATION_TIMEOUT_BEHAVIOR_PAUSE_UNTIL_ANSWERED = 1;
  ELICITATION_TIMEOUT_BEHAVIOR_FAIL_STEP = 2;
  ELICITATION_TIMEOUT_BEHAVIOR_SKIP_WITH_DEFAULT = 3 [deprecated = true];
  ELICITATION_TIMEOUT_BEHAVIOR_FAIL_PLAN = 4;
}

enum PublishApprovalMode {
  PUBLISH_APPROVAL_MODE_UNSPECIFIED = 0;
  PUBLISH_APPROVAL_MODE_REQUIRE_APPROVAL = 1;
  PUBLISH_APPROVAL_MODE_AUTO_PUBLISH = 2;
}

enum ContentOutputFormat {
  CONTENT_OUTPUT_FORMAT_UNSPECIFIED = 0;
  CONTENT_OUTPUT_FORMAT_TEXT_POST = 1;
  CONTENT_OUTPUT_FORMAT_CAROUSEL = 2;
  CONTENT_OUTPUT_FORMAT_IMAGE_BACKED_POST = 3;
  CONTENT_OUTPUT_FORMAT_APPROVAL_ONLY = 4;
}

message PlanSchedule {
  string cron_expression = 1;
  string timezone = 2;
}

message PlanExecution {
  string id = 1;
  string tenant_id = 2;
  string plan_configuration_id = 3;
  PlanConfiguration plan_configuration_snapshot = 4;
  PlanExecutionStatus status = 5;
  repeated StepExecution step_executions = 6;
  string triggered_at = 7;
  string completed_at = 8;
  string created_at = 9;
  string updated_at = 10;
}

enum PlanExecutionStatus {
  PLAN_EXECUTION_STATUS_UNSPECIFIED = 0;
  PLAN_EXECUTION_STATUS_PENDING = 1;
  PLAN_EXECUTION_STATUS_RUNNING = 2;
  PLAN_EXECUTION_STATUS_COMPLETED = 3;
  PLAN_EXECUTION_STATUS_FAILED = 4;
  PLAN_EXECUTION_STATUS_CANCELLED = 5;
}

message StepExecution {
  string id = 1;
  string plan_execution_id = 2;
  string plan_step_key = 3;
  StepExecutionStatus status = 4;
  string input_artifact_id = 5;
  string output_artifact_id = 6;
  string executor_installation_snapshot = 7;
  int32 attempt = 8;
  string elicitation_thread_id = 9;
  string approval_request_id = 10;
  string created_at = 11;
  string updated_at = 12;
}

enum StepExecutionStatus {
  STEP_EXECUTION_STATUS_UNSPECIFIED = 0;
  STEP_EXECUTION_STATUS_PENDING = 1;
  STEP_EXECUTION_STATUS_RUNNING = 2;
  STEP_EXECUTION_STATUS_AWAITING_ELICITATION = 3;
  STEP_EXECUTION_STATUS_AWAITING_APPROVAL = 4;
  STEP_EXECUTION_STATUS_COMPLETED = 5;
  STEP_EXECUTION_STATUS_FAILED = 6;
  STEP_EXECUTION_STATUS_SKIPPED = 7;
}

message GetPlanTemplateRequest {
  string plan_template_id = 1;
}

message GetPlanTemplateResponse {
  PlanTemplate plan_template = 1;
}

message GetPlanTemplateByKeyRequest {
  string key = 1;
}

message GetPlanTemplateByKeyResponse {
  PlanTemplate plan_template = 1;
}

message ListPlanTemplatesRequest {
  optional string vertical = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListPlanTemplatesResponse {
  repeated PlanTemplate plan_templates = 1;
  string next_page_token = 2;
}

message CreatePlanConfigurationRequest {
  string tenant_id = 1;
  string workspace_id = 2;
  string plan_template_id = 3;
  PlanConfigurationStatus status = 4;
  repeated SeedArtifactBinding seed_artifacts = 5;
  repeated SlotBinding slot_bindings = 6;
  repeated OverseerBinding overseer_bindings = 7;
  PlanBehaviorPolicies behavior_policies = 8;
  PlanSchedule schedule = 9;
  string parameter_values_json = 10;
  string thread_id = 11;
  PlanConfigurationKind kind = 12;
}

message CreatePlanConfigurationResponse {
  PlanConfiguration plan_configuration = 1;
}

message GetPlanConfigurationRequest {
  string tenant_id = 1;
  string plan_configuration_id = 2;
}

message GetPlanConfigurationResponse {
  PlanConfiguration plan_configuration = 1;
}

message UpdatePlanConfigurationRequest {
  string tenant_id = 1;
  string plan_configuration_id = 2;
  PlanConfigurationStatus status = 3;
  repeated SeedArtifactBinding seed_artifacts = 4;
  repeated SlotBinding slot_bindings = 5;
  repeated OverseerBinding overseer_bindings = 6;
  PlanBehaviorPolicies behavior_policies = 7;
  PlanSchedule schedule = 8;
  // When true, emit a CONFIGURATION_SAVED thread event. Incremental edits
  // (per-executor binding picks, Suggest) leave this false so the thread is
  // not flooded with a saved message on every change; only explicit user
  // saves announce.
  bool announce_saved = 9;
  string parameter_values_json = 10;
  string thread_id = 11;
  PlanConfigurationKind kind = 12;
}

message UpdatePlanConfigurationResponse {
  PlanConfiguration plan_configuration = 1;
}

message NextTurnRequest {
  string tenant_id = 1;
  string plan_configuration_id = 2;
}

message NextTurnResponse {}

message SubmitConfigurationSelectionRequest {
  string tenant_id = 1;
  string plan_configuration_id = 2;
  // The ASSISTANT_PROMPT message being answered. The server validates it is the
  // current, unanswered prompt for this configuration, and records the
  // USER_SELECTION as in_response_to this id.
  string assistant_prompt_message_id = 3;
  // The user's choice. The server infers the mutation kind (slot binding /
  // overseer / policy / matrix-save) from the prompt's payload state+step, so
  // the client only sends what was picked.
  ConfigurationSelection selection = 4;
}

message ConfigurationSelection {
  string option_id = 1;
  string value = 2;
}

message SubmitConfigurationSelectionResponse {
  // The configuration after the mutation was applied.
  PlanConfiguration plan_configuration = 1;
  // The messages the server appended this turn: USER_SELECTION, optional
  // STEP_REBOUND, and the next ASSISTANT_PROMPT (if any). The frontend may also
  // just render the live watch stream; this is for immediate confirmation.
  repeated harpia.chat.v1.ThreadMessage messages = 2;
  // True when the prompt was already answered (duplicate/double-click retry) —
  // no mutation or message was applied.
  bool already_applied = 3;
}

message ListPlanConfigurationsRequest {
  string tenant_id = 1;
  optional string workspace_id = 2;
  optional PlanConfigurationStatus status = 3;
  int32 page_size = 4;
  string page_token = 5;
  optional string origin_thread_id = 6;
  optional PlanConfigurationKind kind = 7;
}

message ListPlanConfigurationsResponse {
  repeated PlanConfiguration plan_configurations = 1;
  string next_page_token = 2;
}

message CreatePlanExecutionRequest {
  string tenant_id = 1;
  string plan_configuration_id = 2;
}

message CreatePlanExecutionResponse {
  PlanExecution plan_execution = 1;
}

message RetryPlanExecutionRequest {
  string tenant_id = 1;
  string plan_execution_id = 2;
  string step_execution_id = 3;
}

message RetryPlanExecutionResponse {
  PlanExecution plan_execution = 1;
}

message GetPlanExecutionRequest {
  string tenant_id = 1;
  string plan_execution_id = 2;
}

message GetPlanExecutionResponse {
  PlanExecution plan_execution = 1;
}

message ListPlanExecutionsRequest {
  string tenant_id = 1;
  optional string plan_configuration_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListPlanExecutionsResponse {
  repeated PlanExecution plan_executions = 1;
  string next_page_token = 2;
}

message GetStepExecutionRequest {
  string tenant_id = 1;
  string step_execution_id = 2;
}

message GetStepExecutionResponse {
  StepExecution step_execution = 1;
}

message ListStepExecutionsRequest {
  string tenant_id = 1;
  string plan_execution_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListStepExecutionsResponse {
  repeated StepExecution step_executions = 1;
  string next_page_token = 2;
}

// ============================================================
// Elicitation thread (E5.1)
// ============================================================

// ElicitationRequest is a question raised by an agent StepExecution that an
// overseer must answer for the step to resume. The request prompt plus the
// overseer responses form the in-app thread (see thread).
message ElicitationRequest {
  string id = 1;
  string tenant_id = 2;
  string step_execution_id = 3;
  string plan_execution_id = 4;
  string plan_step_key = 5;
  string elicitation_thread_id = 6;
  string prompt = 7;
  // JSON Schema describing the expected response payload (optional).
  string schema_json = 8;
  ElicitationStatus status = 9;
  // The overseer the request is addressed to (from OverseerBinding).
  string overseer_user_id = 10;
  ElicitationTimeoutBehavior timeout_behavior = 11;
  string created_at = 12;
  string expires_at = 13;
  string responded_at = 14;
  string responded_by_user_id = 15;
  // Ordered conversation: the agent prompt followed by overseer responses.
  repeated ThreadMessage thread = 16;
  string plan_configuration_id = 17;
}

enum ElicitationStatus {
  ELICITATION_STATUS_UNSPECIFIED = 0;
  ELICITATION_STATUS_PENDING = 1;
  ELICITATION_STATUS_ANSWERED = 2;
  ELICITATION_STATUS_TIMED_OUT = 3;
  ELICITATION_STATUS_CANCELLED = 4;
}

message ThreadMessage {
  ThreadMessageRole role = 1;
  string text = 2;
  // Structured response payload as a JSON string (optional).
  string payload_json = 3;
  string author_user_id = 4;
  string created_at = 5;
}

enum ThreadMessageRole {
  THREAD_MESSAGE_ROLE_UNSPECIFIED = 0;
  THREAD_MESSAGE_ROLE_AGENT = 1;
  THREAD_MESSAGE_ROLE_OVERSEER = 2;
}

// ElicitationResponse is the overseer answer to an ElicitationRequest.
message ElicitationResponse {
  string request_id = 1;
  // Structured response payload encoded as a JSON string.
  string payload_json = 2;
  string response_text = 3;
  string responded_by_user_id = 4;
  string responded_at = 5;
}

message ListElicitationsRequest {
  string tenant_id = 1;
  optional string step_execution_id = 2;
  optional string plan_execution_id = 3;
  optional ElicitationStatus status = 4;
  // When true, only elicitations addressed to the calling overseer are returned.
  bool addressed_to_me = 5;
  int32 page_size = 6;
  string page_token = 7;
}

message ListElicitationsResponse {
  repeated ElicitationRequest elicitations = 1;
  string next_page_token = 2;
}

message GetElicitationRequest {
  string tenant_id = 1;
  string elicitation_id = 2;
}

message GetElicitationResponse {
  ElicitationRequest elicitation = 1;
}

message RespondToElicitationRequest {
  string tenant_id = 1;
  string elicitation_id = 2;
  // Structured response payload encoded as a JSON string (optional).
  string payload_json = 3;
  string response_text = 4;
}

message RespondToElicitationResponse {
  ElicitationRequest elicitation = 1;
}

message WatchElicitationsRequest {
  string tenant_id = 1;
  optional string step_execution_id = 2;
  bool addressed_to_me = 3;
}

message WatchElicitationsResponse {
  repeated ElicitationRequest elicitations = 1;
}

// ============================================================
// Publish approval gate (E5.2)
// ============================================================

// ApprovalRequest is a human gate for a risky transition such as publishing a
// LinkedInPostDraft externally. Distinct from ElicitationRequest even though
// both pause StepExecution and resume via Temporal signals.
message ApprovalRequest {
  string id = 1;
  string tenant_id = 2;
  string step_execution_id = 3;
  string plan_execution_id = 4;
  string plan_step_key = 5;
  // Artifact preview source (typically LinkedInPostDraft from adapt-for-linkedin).
  string input_artifact_id = 6;
  ApprovalRequestStatus status = 7;
  string decision_reason = 8;
  string requested_at = 9;
  string decided_at = 10;
  string plan_configuration_id = 11;
  // Owning chat thread for returning to the in-context approval card.
  string thread_id = 12;
}

enum ApprovalRequestStatus {
  APPROVAL_REQUEST_STATUS_UNSPECIFIED = 0;
  APPROVAL_REQUEST_STATUS_PENDING = 1;
  APPROVAL_REQUEST_STATUS_APPROVED = 2;
  APPROVAL_REQUEST_STATUS_REJECTED = 3;
}

message ListApprovalRequestsRequest {
  string tenant_id = 1;
  optional string step_execution_id = 2;
  optional string plan_execution_id = 3;
  optional ApprovalRequestStatus status = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListApprovalRequestsResponse {
  repeated ApprovalRequest approval_requests = 1;
  string next_page_token = 2;
}

message GetApprovalRequestRequest {
  string tenant_id = 1;
  string approval_request_id = 2;
}

message GetApprovalRequestResponse {
  ApprovalRequest approval_request = 1;
}

message RespondToApprovalRequestRequest {
  string tenant_id = 1;
  string approval_request_id = 2;
  bool approved = 3;
  // Required when approved=false; optional on approve.
  string reason = 4;
}

message RespondToApprovalRequestResponse {
  ApprovalRequest approval_request = 1;
}

message WatchApprovalRequestsRequest {
  string tenant_id = 1;
  optional string step_execution_id = 2;
  optional string plan_execution_id = 3;
}

message WatchApprovalRequestsResponse {
  repeated ApprovalRequest approval_requests = 1;
}
