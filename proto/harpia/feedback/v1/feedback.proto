syntax = "proto3";

package harpia.feedback.v1;


// FeedbackService manages the human-in-the-loop interactions. When an agent
// encounters a decision point that requires human judgment, this service
// handles the approval/rejection lifecycle across multiple channels (UI, Slack).
//
// This is a separate bounded context from Task Management (see ADR-006).
// Human interaction has its own ubiquitous language and lifecycle.
service FeedbackService {
  // RequestFeedback sends a feedback request to the human via the configured
  // channel (UI notification, Slack message, etc.).
  rpc RequestFeedback(RequestFeedbackRequest) returns (RequestFeedbackResponse);

  // SubmitFeedback records a human's decision on a pending feedback request.
  rpc SubmitFeedback(SubmitFeedbackRequest) returns (SubmitFeedbackResponse);

  // ListPendingFeedback lists all feedback requests awaiting human response
  // for a tenant.
  rpc ListPendingFeedback(ListPendingFeedbackRequest) returns (stream ListPendingFeedbackResponse);

  // GetFeedbackStatus returns the current status of a feedback request.
  rpc GetFeedbackStatus(GetFeedbackStatusRequest) returns (GetFeedbackStatusResponse);
}

message FeedbackRequest_ {
  string id = 1;
  string tenant_id = 2;
  string task_id = 3;
  string subtask_id = 4;
  string agent_instance_id = 5;
  FeedbackStatus status = 6;
  string question = 7;          // What the agent is asking about
  repeated string options = 8;  // Available responses
  FeedbackChannel channel = 9;  // Where the request was sent
  string external_ref = 10;     // External ID (e.g., Slack message TS)
  string created_at = 11;
  string resolved_at = 12;
}

enum FeedbackStatus {
  FEEDBACK_STATUS_UNSPECIFIED = 0;
  FEEDBACK_STATUS_PENDING = 1;
  FEEDBACK_STATUS_APPROVED = 2;
  FEEDBACK_STATUS_REJECTED = 3;
  FEEDBACK_STATUS_MODIFIED = 4;
  FEEDBACK_STATUS_EXPIRED = 5;
  FEEDBACK_STATUS_CANCELLED = 6;
}

enum FeedbackChannel {
  FEEDBACK_CHANNEL_UNSPECIFIED = 0;
  FEEDBACK_CHANNEL_UI = 1;
  FEEDBACK_CHANNEL_SLACK = 2;
  FEEDBACK_CHANNEL_EMAIL = 3;
}

enum FeedbackDecision {
  FEEDBACK_DECISION_UNSPECIFIED = 0;
  FEEDBACK_DECISION_APPROVE = 1;
  FEEDBACK_DECISION_REJECT = 2;
  FEEDBACK_DECISION_MODIFY = 3;
}

message RequestFeedbackRequest {
  string tenant_id = 1;
  string task_id = 2;
  string subtask_id = 3;
  string agent_instance_id = 4;
  string question = 5;
  repeated string options = 6;
  repeated FeedbackChannel channels = 7;
}

message RequestFeedbackResponse {
  FeedbackRequest_ feedback_request = 1;
}

message SubmitFeedbackRequest {
  string tenant_id = 1;
  string feedback_id = 2;
  FeedbackDecision decision = 3;
  string comment = 4;
}

message SubmitFeedbackResponse {
  FeedbackRequest_ feedback_request = 1;
}

message ListPendingFeedbackRequest {
  string tenant_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListPendingFeedbackResponse {
  repeated FeedbackRequest_ feedback_requests = 1;
  string next_page_token = 2;
}

message GetFeedbackStatusRequest {
  string tenant_id = 1;
  string feedback_id = 2;
}

message GetFeedbackStatusResponse {
  FeedbackRequest_ feedback_request = 1;
}
