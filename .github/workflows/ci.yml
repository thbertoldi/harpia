name: CI

on:
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - lang: go
            working-directory: control-plane
            run: |
              go fmt ./...
              go vet ./...
          - lang: python
            working-directory: agent-runtime
            run: |
              pip install ruff
              ruff check src/
          - lang: svelte
            working-directory: frontend
            run: |
              bun install --frozen-lockfile
              bun run lint
          - lang: api-key-scan
            working-directory: .
            run: python scripts/ci/scan_api_key_patterns.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.lang == 'go'
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: control-plane/go.sum
      - uses: actions/setup-python@v5
        if: matrix.lang == 'python' || matrix.lang == 'api-key-scan'
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        if: matrix.lang == 'svelte'
        with:
          bun-version: latest
      - name: Lint
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.run }}

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - lang: go
            working-directory: control-plane
            run: go test $(go list ./... | grep -vE '/internal/(acceptance|audit)$')
          - lang: python
            working-directory: agent-runtime
            run: |
              pip install -e ".[dev]"
              pytest tests/ --tb=short
          - lang: svelte
            working-directory: frontend
            run: |
              bun install --frozen-lockfile
              bun run test -- --passWithNoTests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.lang == 'go'
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: control-plane/go.sum
      - uses: actions/setup-python@v5
        if: matrix.lang == 'python'
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        if: matrix.lang == 'svelte'
        with:
          bun-version: latest
      - name: Test
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.run }}

  tooling:
    name: Tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install pinned tooling
        run: bun install --global @fission-ai/openspec@1.5.0 opencode-ai@1.17.18
      - name: Validate OpenSpec
        run: openspec validate --all --strict --no-interactive
      - name: Test OpenCode validator
        run: bun test scripts/ci/validate_opencode.test.ts
      - name: Validate OpenCode roster
        run: bun run scripts/ci/validate_opencode.ts

  buf-breaking:
    name: Buf Breaking Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint protobuf
        working-directory: proto
        run: buf lint
      - name: Check breaking changes
        working-directory: proto
        run: |
          buf breaking --against "https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref }},subdir=proto" --error-format=text

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest
      - name: Lint Helm chart
        run: helm lint deploy/harpia/
      - name: Validate Helm template
        run: helm template test deploy/harpia/ > /dev/null

  acceptance:
    name: Acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: harpia
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d harpia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Run database migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/harpia?sslmode=disable
        run: mise run db-migrate
      - name: Provision non-superuser acceptance app role
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgres://postgres@localhost:5432/harpia?sslmode=disable" <<'SQL'
          CREATE ROLE harpia_app LOGIN PASSWORD 'harpia-app-password' NOBYPASSRLS;
          GRANT CONNECT ON DATABASE harpia TO harpia_app;
          GRANT USAGE ON SCHEMA public TO harpia_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO harpia_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO harpia_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO harpia_app;
          SQL
      - name: Run production acceptance
        env:
          HARPIA_TEST_DATABASE_URL: postgres://harpia_app:harpia-app-password@localhost:5432/harpia?sslmode=disable
        run: mise run acceptance
      - name: Run full Go suite with the acceptance app role
        env:
          HARPIA_TEST_DATABASE_URL: postgres://harpia_app:harpia-app-password@localhost:5432/harpia?sslmode=disable
        run: cd control-plane && go test ./...
      - name: Enforce archived delivery evidence
        run: mise run openspec-delivery-check

  publish-chart:
    name: Publish Helm Chart
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
    needs: [helm-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest
      - name: Login to GitHub Container Registry
        run: echo "${{ env.REGISTRY_PASSWORD }}" | helm registry login ${{ env.REGISTRY }} -u ${{ env.REGISTRY_USER }} --password-stdin
      - name: Package and push chart
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::7}"
          VERSION="0.1.0-${SHA}"
          helm package deploy/harpia/ --app-version "${SHA}" --version "${VERSION}"
          helm push "harpia-${VERSION}.tgz" oci://${{ env.REGISTRY }}/${{ github.repository }}

  build-containers:
    name: Build and Publish Containers
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
    needs: [lint, test, tooling, buf-breaking, helm-lint, acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: control-plane
            context: control-plane
            dockerfile: control-plane/Containerfile
          - name: agent-runtime
            context: .
            dockerfile: agent-runtime/Containerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Containerfile
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/trunk' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
