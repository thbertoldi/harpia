name: CI

on:
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - lang: go
            working-directory: control-plane
            run: |
              go fmt ./...
              go vet ./...
          - lang: python
            working-directory: agent-runtime
            run: |
              pip install ruff
              ruff check src/
          - lang: svelte
            working-directory: frontend
            run: |
              bun install --frozen-lockfile
              bun run lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.lang == 'go'
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: control-plane/go.sum
      - uses: actions/setup-python@v5
        if: matrix.lang == 'python'
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        if: matrix.lang == 'svelte'
        with:
          bun-version: latest
      - name: Lint
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.run }}

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - lang: go
            working-directory: control-plane
            run: go test ./...
          - lang: python
            working-directory: agent-runtime
            run: |
              pip install -e .
              pip install pytest pytest-asyncio
              pytest tests/ --tb=short
          - lang: svelte
            working-directory: frontend
            run: |
              bun install --frozen-lockfile
              bun run test -- --passWithNoTests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.lang == 'go'
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: control-plane/go.sum
      - uses: actions/setup-python@v5
        if: matrix.lang == 'python'
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        if: matrix.lang == 'svelte'
        with:
          bun-version: latest
      - name: Test
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.run }}

  buf-breaking:
    name: Buf Breaking Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint protobuf
        working-directory: proto
        run: buf lint
      - name: Check breaking changes
        working-directory: proto
        run: |
          buf breaking --against "https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref }},subdir=proto" --error-format=text

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest
      - name: Lint Helm chart
        run: helm lint deploy/harpia/
      - name: Validate Helm template
        run: helm template test deploy/harpia/ > /dev/null

  build-containers:
    name: Build and Publish Containers
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
    needs: [lint, test, buf-breaking, helm-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: control-plane
            context: control-plane
            dockerfile: control-plane/Containerfile
          - name: agent-runtime
            context: agent-runtime
            dockerfile: agent-runtime/Containerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Containerfile
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/trunk' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
