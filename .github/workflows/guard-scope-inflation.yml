name: Guard Scope Inflation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  detect:
    name: Detect possible scope inflation
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Resolve linked issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          issue_number="$(gh pr view "$PR_NUMBER" --json closingIssuesReferences --jq '.closingIssuesReferences[0].number // ""')"
          if [ -z "$issue_number" ]; then
            echo "issue_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh issue view "$issue_number" --json body,labels,number,url > issue.json
          {
            echo "issue_found=true"
            echo "issue_number=$issue_number"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch pull request head
        if: steps.issue.outputs.issue_found == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git fetch --no-tags --depth=1 "$HEAD_REPO_URL" "$HEAD_SHA"

      - name: Detect scope signals
        if: steps.issue.outputs.issue_found == 'true'
        id: guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/guard_scope_inflation.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --issue-json issue.json \
            --comment-file guard-comment.md \
            --result-file guard-result.json
          echo "detected=$(jq -r '.detected' guard-result.json)" >> "$GITHUB_OUTPUT"

      - name: Upsert warning comment
        if: steps.guard.outputs.detected == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 scripts/ci/upsert_guard_comment.py \
            --repo "$GITHUB_REPOSITORY" \
            --issue-number "$PR_NUMBER" \
            --comment-file guard-comment.md \
            --marker "<!-- harpia-guard:scope-inflation -->"
