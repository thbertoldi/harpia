[project]
name = "harpia-agents"
version = "0.1.0"
description = "Harpia agent runtime — LangGraph-based AI agents"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
    "temporalio>=1.8.0",
    "redis>=5.0", # Valkey wire-compatible (no separate valkey-py package)
    "connectrpc==0.10.1",
    "pydantic>=2.0",
    "httpx>=0.28.0",
    "structlog>=24.0",
    "uvicorn>=0.32.0",
    "protobuf>=7.35.1",
    "pyyaml>=6.0",
]

[project.scripts]
harpia-agent = "harpia_agents.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harpia_agents", "src/harpia"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/gen/", ".venv/", "build/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "TID"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "Use harpia_agents.llm.providers instead of direct anthropic SDK imports."
"openai".msg = "Use harpia_agents.llm.providers instead of direct openai SDK imports."
"ollama".msg = "Use harpia_agents.llm.providers instead of direct ollama SDK imports."

[tool.ruff.lint.per-file-ignores]
"src/harpia_agents/llm/providers/*.py" = ["TID251"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
