apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odoo-postgres-data
  namespace: odoo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo-postgres
  namespace: odoo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: odoo-postgres
  template:
    metadata:
      labels:
        app: odoo-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: odoo-postgres-credentials, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: odoo-postgres-credentials, key: password}}
            - name: POSTGRES_DB
              value: odoo
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: odoo-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: odoo-postgres
  namespace: odoo
spec:
  type: ClusterIP
  selector:
    app: odoo-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
