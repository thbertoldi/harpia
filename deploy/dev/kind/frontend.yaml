# Harpia Dev — Frontend (SvelteKit)
# Image built by Tilt via docker_build
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harpia-frontend
  labels:
    app: harpia-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harpia-frontend
  template:
    metadata:
      labels:
        app: harpia-frontend
    spec:
      containers:
        - name: frontend
          image: harpia-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: harpia-frontend
  labels:
    app: harpia-frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: harpia-frontend
