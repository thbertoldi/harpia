# Development dependencies (PostgreSQL + Valkey + Garage)
# Temporal replaced by Temporalite (single binary, see mise task dev-temporalite)
# Use: podman-compose -f deploy/dev/compose.yaml up -d

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: harpia
      POSTGRES_PASSWORD: harpia
      POSTGRES_DB: harpia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    ports:
      - "6379:6379"

  garage:
    image: docker.io/dxflrs/garage:v1.0
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    environment:
      GARAGE_LOG_TO_SYSLOG: "0"

volumes:
  pgdata:
  garage-meta:
  garage-data:
