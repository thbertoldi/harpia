# Development dependencies (PostgreSQL + Valkey + Garage + OpenFGA)
# Zitadel and Temporal are started externally via mise tasks:
#   mise run dev-zitadel     -> Zitadel identity provider
#   mise run dev-temporal    -> Temporal dev server
# Use: podman-compose -f deploy/dev/compose.yaml up -d

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: harpia
      POSTGRES_PASSWORD: harpia
      POSTGRES_DB: harpia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    ports:
      - "6379:6379"

  garage:
    image: docker.io/dxflrs/garage:v1.0
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    environment:
      GARAGE_LOG_TO_SYSLOG: "0"

  openfga:
    image: docker.io/openfga/openfga:latest
    ports:
      - "8081:8080"
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: "postgres://harpia:harpia@postgres:5432/openfga"
      OPENFGA_LOG_LEVEL: info
      OPENFGA_PLAYGROUND_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_started

volumes:
  pgdata:
  garage-meta:
  garage-data:
