# Harpia Development Dependencies
# Start: podman compose -f deploy/dev/compose.yaml up -d
# Stop:  podman compose -f deploy/dev/compose.yaml down
#
# Services communicate on the internal compose network.
# For local API development, connect via podman network:
#   DATABASE_URL="postgres://<user>:<password>@localhost:15000/harpia?sslmode=disable"
#   (access host-mapped ports after starting)
#
# To expose a service to the host, uncomment the ports: line.
#
# Temporal server is started separately:
#   mise run dev-temporal

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${HARPIA_DEV_POSTGRES_USERNAME:-harpia}
      POSTGRES_PASSWORD: ${HARPIA_DEV_POSTGRES_PASSWORD:-dev-postgres-password}
      POSTGRES_DB: harpia
    expose:
      - "5432"
    # ports:
    #   - "15000:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "harpia"]
      interval: 2s
      timeout: 5s
      retries: 10

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    expose:
      - "6379"
    # ports:
    #   - "15001:6379"

  garage:
    image: docker.io/dxflrs/garage:v1.0.1
    expose:
      - "3900"
      - "3901"
      - "3902"
    # ports:
    #   - "15002:3900"
    #   - "15003:3901"
    #   - "15004:3902"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.62.0
    command:
      - "start-from-init"
      - "--masterkey"
      - "${HARPIA_DEV_ZITADEL_KEY:-00000000000000000000000000000000}"
      - "--tlsMode"
      - "disabled"
    expose:
      - "8080"
    # ports:
    #   - "15005:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${HARPIA_DEV_POSTGRES_USERNAME:-harpia}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${HARPIA_DEV_POSTGRES_PASSWORD:-dev-postgres-password}
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${HARPIA_DEV_POSTGRES_USERNAME:-harpia}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${HARPIA_DEV_POSTGRES_PASSWORD:-dev-postgres-password}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Harpia
      ZITADEL_FIRSTINSTANCE_HUMAN_EMAIL: admin@harpia.local
      ZITADEL_FIRSTINSTANCE_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_HUMAN_PASSWORD: HarpiaAdmin1!

  openfga:
    image: docker.io/openfga/openfga:v1.8.0
    command: ["run"]
    expose:
      - "8080"
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: "postgres://${HARPIA_DEV_POSTGRES_USERNAME:-harpia}:${HARPIA_DEV_POSTGRES_PASSWORD:-dev-postgres-password}@postgres:5432/openfga?sslmode=disable"
      OPENFGA_LOG_LEVEL: info
      OPENFGA_PLAYGROUND_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  garage-meta:
  garage-data:
