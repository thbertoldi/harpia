{{- if .Values.openfga.enabled }}
{{- $svcName := include "harpia.serviceName" (dict "name" "openfga" "root" .) }}
{{- $datastoreURI := printf "postgres://%s:%s@%s:5432/openfga?sslmode=disable" .Values.postgres.user .Values.postgres.password (include "harpia.serviceName" (dict "name" "postgres" "root" .)) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "harpia.labels" . | nindent 4 }}
    app: {{ $svcName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $svcName }}
  template:
    metadata:
      labels:
        app: {{ $svcName }}
    spec:
      initContainers:
        - name: migrate
          image: {{ .Values.openfga.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "migrate"
            - "--datastore-engine"
            - "postgres"
            - "--datastore-uri"
            - {{ $datastoreURI | quote }}
      containers:
        - name: openfga
          image: {{ .Values.openfga.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run"]
          ports:
            - containerPort: 8080
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: "postgres"
            - name: OPENFGA_DATASTORE_URI
              value: {{ $datastoreURI | quote }}
            - name: OPENFGA_LOG_LEVEL
              value: "info"
            - name: OPENFGA_PLAYGROUND_ENABLED
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "harpia.labels" . | nindent 4 }}
    app: {{ $svcName }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: {{ $svcName }}
{{- end }}
