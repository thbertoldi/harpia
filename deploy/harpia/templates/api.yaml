{{- if .Values.api.enabled }}
{{- $svcName := include "harpia.serviceName" (dict "name" "api" "root" .) }}
{{- $postgresHost := include "harpia.serviceName" (dict "name" "postgres" "root" .) }}
{{- $valkeyHost := include "harpia.serviceName" (dict "name" "valkey" "root" .) }}
{{- $garageHost := include "harpia.serviceName" (dict "name" "garage" "root" .) }}
{{- $zitadelHost := include "harpia.serviceName" (dict "name" "zitadel" "root" .) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "harpia.labels" . | nindent 4 }}
    app: {{ $svcName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $svcName }}
  template:
    metadata:
      labels:
        app: {{ $svcName }}
    spec:
      containers:
        - name: api
          image: {{ include "harpia.image" (dict "imageRepo" (printf "%s/control-plane" .Values.image.repository) "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: DATABASE_URL
              value: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgres.user .Values.postgres.password $postgresHost .Values.postgres.database | quote }}
            - name: VALKEY_URL
              value: {{ printf "valkey://%s:6379" $valkeyHost | quote }}
            - name: TEMPORAL_HOST
              value: "temporal:7233"
            - name: GARAGE_URL
              value: {{ printf "http://%s:3900" $garageHost | quote }}
            - name: ZITADEL_URL
              value: {{ printf "http://%s:8080" $zitadelHost | quote }}
            - name: HARPIA_ALLOW_DEV_AUTH
              value: {{ .Values.api.auth.allowDevAuth | quote }}
            - name: HARPIA_AUTO_PROVISION_DEFAULT_TENANT
              value: {{ .Values.api.auth.autoProvisionDefaultTenant | quote }}
            - name: HARPIA_AUTH_CACHE_TTL
              value: {{ .Values.api.auth.cacheTTL | quote }}
            - name: LOG_LEVEL
              value: "debug"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 2
            periodSeconds: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "harpia.labels" . | nindent 4 }}
    app: {{ $svcName }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
  selector:
    app: {{ $svcName }}
{{- end }}
