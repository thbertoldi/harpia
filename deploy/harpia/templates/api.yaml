apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harpia.fullname" . }}-api
  labels:
    app: {{ include "harpia.name" . }}-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "harpia.name" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "harpia.name" . }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: DATABASE_URL
              value: "postgres://{{ .Values.database.user }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: VALKEY_URL
              value: "valkey://{{ .Values.valkey.host }}:{{ .Values.valkey.port }}"
            - name: GARAGE_URL
              value: {{ .Values.garage.endpoint }}
            - name: ZITADEL_URL
              value: {{ .Values.zitadel.issuerUrl }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "harpia.fullname" . }}-api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  selector:
    app: {{ include "harpia.name" . }}-api
