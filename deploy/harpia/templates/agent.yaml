{{- if .Values.agent.enabled }}
{{- $svcName := include "harpia.serviceName" (dict "name" "agent" "root" .) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "harpia.labels" . | nindent 4 }}
    app: {{ $svcName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $svcName }}
  template:
    metadata:
      labels:
        app: {{ $svcName }}
    spec:
      containers:
        - name: agent
          image: {{ include "harpia.image" (dict "imageRepo" (printf "%s/agent-runtime" .Values.image.repository) "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.agent.port }}
          env:
            - name: HARPIA_AGENT_HOST
              value: "0.0.0.0"
            - name: HARPIA_AGENT_PORT
              value: {{ .Values.agent.port | quote }}
            - name: TEMPORAL_HOST
              value: "temporal:7233"
            - name: HARPIA_ROLE
              value: {{ .Values.agent.role | quote }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "harpia.labels" . | nindent 4 }}
    app: {{ $svcName }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.agent.port }}
      targetPort: {{ .Values.agent.port }}
  selector:
    app: {{ $svcName }}
{{- end }}
