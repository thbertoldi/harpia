{{- if .Values.postgres.enabled }}
{{- $svcName := include "harpia.serviceName" (dict "name" "postgres" "root" .) }}
{{- $credentialsSecret := .Values.postgres.credentialsSecret }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $svcName }}-pvc
  labels:
    {{- include "harpia.labels" . | nindent 4 }}
    app: {{ $svcName }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $svcName }}-init
  labels:
    {{- include "harpia.labels" . | nindent 4 }}
    app: {{ $svcName }}
data:
  01-create-dbs.sh: |
    set -eo pipefail

    psql -v ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" \
      --dbname "$POSTGRES_DB" \
      -v db_user="$POSTGRES_USER" <<'SQL'
    SELECT 'CREATE DATABASE zitadel'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'zitadel')\gexec
    SELECT 'CREATE DATABASE openfga'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'openfga')\gexec
    GRANT ALL PRIVILEGES ON DATABASE zitadel TO :"db_user";
    GRANT ALL PRIVILEGES ON DATABASE openfga TO :"db_user";
    SQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "harpia.labels" . | nindent 4 }}
    app: {{ $svcName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $svcName }}
  template:
    metadata:
      labels:
        app: {{ $svcName }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialsSecret.name | quote }}
                  key: {{ $credentialsSecret.usernameKey | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $credentialsSecret.name | quote }}
                  key: {{ $credentialsSecret.passwordKey | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U \"$POSTGRES_USER\""]
            initialDelaySeconds: 3
            periodSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $svcName }}-pvc
        - name: init
          configMap:
            name: {{ $svcName }}-init
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "harpia.labels" . | nindent 4 }}
    app: {{ $svcName }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: {{ $svcName }}
{{- end }}
