# Production overlay — secure defaults for a full in-cluster stack.

replicaCount: 2

image:
  pullPolicy: IfNotPresent
  tag: latest

postgres:
  storage: 50Gi

api:
  logLevel: info
  auth:
    allowDevAuth: false
    autoProvisionDefaultTenant: false

agent:
  auth:
    allowDevAuth: false

frontend:
  enabled: true

openfga:
  playgroundEnabled: false

zitadel:
  externalSecure: "true"
  tlsEnabled: "true"
  adminEmailVerified: "true"

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi
