replicaCount: 1

image:
  repository: harpia/control-plane
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false

database:
  host: postgres
  port: 5432
  name: harpia
  user: harpia

valkey:
  host: valkey
  port: 6379

garage:
  endpoint: http://garage:3900

zitadel:
  issuerUrl: http://zitadel:8080

openfga:
  host: openfga
  port: 8081

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
