# Deployment settings
replicaCount: 1
namespace: harpia

# Image registry
image:
  registry: ghcr.io
  repository: thbertoldi/harpia
  tag: latest
  pullPolicy: IfNotPresent

# Postgres
postgres:
  enabled: true
  image: docker.io/library/postgres:16-alpine
  database: harpia
  # Existing Secret that contains the database login material.
  credentialsSecret:
    name: postgres-credentials
    usernameKey: username
    passwordKey: password
  storage: 10Gi

# Valkey
valkey:
  enabled: true
  image: docker.io/valkey/valkey:8-alpine

# Garage
garage:
  enabled: true
  image: docker.io/dxflrs/garage:v1.0.1

# Zitadel
zitadel:
  enabled: true
  image: ghcr.io/zitadel/zitadel:v2.62.0
  externalDomain: localhost
  externalPort: "8085"
  externalSecure: "false"
  tlsEnabled: "false"
  orgName: Harpia
  adminUsername: admin
  adminEmail: admin@harpia.local
  adminEmailVerified: "true"
  adminPassword: HarpiaAdmin1!
  # Existing Secret that contains the Zitadel master key.
  masterkeySecret:
    name: zitadel-masterkey
    key: masterkey
  machinekey:
    storage: 16Mi
  machineUser:
    username: zitadel-admin-sa
    name: Admin Service Account
    patExpirationDate: "2099-01-01T00:00:00Z"
  # Harpia auth-screen + email branding (M6 §2.7). Mirrors the dev cluster's
  # zitadel-branding ConfigMap + init Job, parameterized so tenants can override.
  branding:
    enabled: true
    # Image must provide curl + a POSIX shell (alpine/k8s ships both + kubectl).
    image: alpine/k8s:1.31.0
    colors:
      primary: "#C8920F"        # gold
      background: "#121318"     # obsidian surface
      backgroundEdge: "#0A0B0E" # radial-gradient outer stop
      font: "#F5F2EB"           # cream text
      warn: "#CD3D56"
    # Wordmark — light variant (cream) for the dark auth surface.
    # TODO: replace with final Bodoni Moda render from design.
    logoSvg: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" role="img" aria-label="Harpia">
        <rect width="360" height="80" fill="none"/>
        <text x="180" y="56" text-anchor="middle"
              font-family="'Bodoni Moda', Georgia, 'Times New Roman', serif"
              font-size="52" font-weight="600" letter-spacing="2"
              fill="#F5F2EB">Harpia</text>
      </svg>
    iconSvg: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Harpia">
        <rect width="64" height="64" rx="12" fill="#121318"/>
        <text x="32" y="44" text-anchor="middle"
              font-family="Georgia, 'Times New Roman', serif"
              font-size="34" font-weight="700" fill="#C8920F">H</text>
      </svg>
    # Branded email copy (EN + pt). Zitadel uses locale code "pt", not pt-BR.
    # type one of: passwordreset, init, verifyemail. field one of:
    # subject, greeting, text, button.
    emailTexts: |
      passwordreset|en|subject|Reset your Harpia password
      passwordreset|en|greeting|Hi {{.FirstName}},
      passwordreset|en|text|We received a request to reset your Harpia password. Use the button below to choose a new one. If you didn't request this, you can ignore this email.
      passwordreset|en|button|Reset password
      passwordreset|pt|subject|Redefinir sua senha Harpia
      passwordreset|pt|greeting|Olá {{.FirstName}},
      passwordreset|pt|text|Recebemos um pedido para redefinir sua senha Harpia. Use o botão abaixo para escolher uma nova. Se você não fez este pedido, ignore este e-mail.
      passwordreset|pt|button|Redefinir senha
      init|en|subject|Welcome to Harpia
      init|en|greeting|Hi {{.FirstName}},
      init|en|text|Your Harpia account has been created. Use the button below to set your password and activate access.
      init|en|button|Activate account
      init|pt|subject|Bem-vindo à Harpia
      init|pt|greeting|Olá {{.FirstName}},
      init|pt|text|Sua conta na Harpia foi criada. Use o botão abaixo para definir sua senha e ativar o acesso.
      init|pt|button|Ativar conta
      verifyemail|en|subject|Verify your Harpia sign-in
      verifyemail|en|greeting|Hi {{.FirstName}},
      verifyemail|en|text|Use the code or button below to complete verification and keep your Harpia account secure.
      verifyemail|en|button|Confirm sign-in
      verifyemail|pt|subject|Verifique seu acesso Harpia
      verifyemail|pt|greeting|Olá {{.FirstName}},
      verifyemail|pt|text|Use o código ou o botão abaixo para concluir a verificação e proteger sua conta Harpia.
      verifyemail|pt|button|Confirmar acesso

# OpenFGA
openfga:
  enabled: true
  image: docker.io/openfga/openfga:v1.8.0
  logLevel: info
  playgroundEnabled: true

# API
api:
  enabled: true
  port: 8080
  logLevel: info
  auth:
    allowDevAuth: false
    autoProvisionDefaultTenant: false
    cacheTTL: 60s
    cacheMaxEntries: 1024

# Agent Runtime
agent:
  enabled: true
  port: 8000
  role: server
  auth:
    allowDevAuth: false

# Frontend
frontend:
  enabled: true
  port: 3000

# Resource limits/requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
