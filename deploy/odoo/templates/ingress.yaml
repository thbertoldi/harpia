{{- if not .Values.ingress.host }}
{{- fail "ingress.host is required; the Odoo chart never renders a public HTTP fallback" }}
{{- end }}
{{- if not .Values.ingress.tlsSecret }}
{{- fail "ingress.tlsSecret is required; the Odoo chart requires TLS" }}
{{- end }}
{{- $namespace := include "odoo.namespace" . }}
{{- $serviceName := include "odoo.serviceName" (dict "name" "web" "root" .) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $serviceName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecret | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $serviceName }}
                port:
                  name: http
