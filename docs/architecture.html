<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harpia — System Architecture</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --obsidian: #121318;
    --obsidian-light: #1A1B24;
    --obsidian-mid: #22242F;
    --plumage: #2A2D3A;
    --crown-ash: #9DA1AB;
    --crown-ash-dark: #6B7080;
    --talon-gold: #C8920F;
    --talon-gold-bright: #E0A512;
    --cream: #F5F2EB;
    --font-heading: 'Bodoni Moda', serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    color: var(--obsidian);
    font-family: var(--font-body);
    padding: 3rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 2.6rem;
    color: var(--obsidian);
    margin-bottom: 0.25rem;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--talon-gold);
    margin-bottom: 2.5rem;
  }

  .diagram {
    width: 1100px;
    max-width: 100%;
  }

  svg text.heading {
    font-family: var(--font-heading);
    font-weight: 700;
  }

  svg text.label {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 12px;
  }

  svg text.mono {
    font-family: var(--font-mono);
    font-size: 10px;
  }

  svg text.small {
    font-family: var(--font-mono);
    font-size: 9px;
  }

  svg line.conn {
    stroke: var(--crown-ash-dark);
    stroke-width: 1.5;
    stroke-dasharray: 6 3;
  }

  svg line.conn-solid {
    stroke: var(--crown-ash-dark);
    stroke-width: 2;
  }

  .legend {
    display: flex;
    gap: 2rem;
    margin-top: 2rem;
    font-size: 0.75rem;
    color: var(--crown-ash-dark);
  }

  .legend span { display: flex; align-items: center; gap: 0.5rem; }
  .legend .dot { width: 10px; height: 10px; border-radius: 2px; }
  .legend .dash { width: 20px; height: 0; border-top: 1.5px dashed var(--crown-ash-dark); }
  .legend .solid { width: 20px; height: 0; border-top: 2px solid var(--crown-ash-dark); }
</style>
</head>
<body>
